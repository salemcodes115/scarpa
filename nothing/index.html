<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Gallery — Nothing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Product Gallery</h1>
    <div class="controls">
      <button id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="container">
    <section class="gallery" id="gallery">
      <article class="card">
        <div class="card-media" style="background-image:url('https://picsum.photos/seed/p1/800/600')"></div>
        <div class="card-body">
          <h2 class="card-title">Aurora Headphones</h2>
          <p class="card-desc">Immersive sound with sleek design. Lightweight and comfy for all-day use.</p>
          <div class="card-foot">
            <span class="price">$129</span>
            <button class="btn">View</button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-media" style="background-image:url('https://picsum.photos/seed/p2/800/600')"></div>
        <div class="card-body">
          <h2 class="card-title">Nova Speaker</h2>
          <p class="card-desc">Crisp audio, deep bass. Portable speaker with long battery life.</p>
          <div class="card-foot">
            <span class="price">$89</span>
            <button class="btn">View</button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-media" style="background-image:url('https://picsum.photos/seed/p3/800/600')"></div>
        <div class="card-body">
          <h2 class="card-title">Orbit Smartwatch</h2>
          <p class="card-desc">Health tracking, notifications, and elegant UI—designed to fit your life.</p>
          <div class="card-foot">
            <span class="price">$199</span>
            <button class="btn">View</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
