<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Todo App — Mini Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1>Todo App</h1>
            <p class="tag">Simple, local, and accessible</p>
        </header>

        <section class="new-task">
            <label for="taskInput" class="sr-only">Add new task</label>
            <input id="taskInput" type="text" placeholder="Add a new task and press Enter" autocomplete="off">
            <button id="addBtn" class="btn">Add</button>
        </section>

        <section class="controls">
            <div class="filters" role="tablist" aria-label="Filter tasks">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="active">Active</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>
            <div>
                <button id="clearCompleted" class="btn muted">Clear Completed</button>
                <button id="clearAll" class="btn danger">Clear All</button>
            </div>
        </section>

        <section>
            <ul id="taskList" class="task-list" aria-live="polite"></ul>
        </section>

        <footer class="app-footer">
            <span id="counts">0 tasks</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
